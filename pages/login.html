<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Shop.me</title>
    <link rel="stylesheet" href="../css/auth.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="auth-container">
        <!-- Left Section - Promotional -->
        <div class="auth-left">
            <div class="promo-content">
                <div class="logo">
                    <h1>Shop.me</h1>
                </div>
                <div class="promo-text">
                    <h2>Welcome Back</h2>
                    <p>Sign in to access your account and continue shopping</p>
                    <ul class="benefits">
                        <li><i class="fas fa-shipping-fast"></i> Fast & Free Shipping</li>
                        <li><i class="fas fa-shield-alt"></i> Secure Checkout</li>
                        <li><i class="fas fa-headset"></i> 24/7 Customer Support</li>
                        <li><i class="fas fa-gift"></i> Exclusive Deals & Offers</li>
                    </ul>
                </div>
            </div>
        </div>

        <!-- Right Section - Login Form -->
        <div class="auth-right">
            <div class="form-container">
                <div class="form-header">
                    <h2>Sign In</h2>
                    <p>Enter your email and password to continue</p>
                </div>

                <form id="loginForm" class="auth-form">
                    <div class="form-group">
                        <label for="email">Email or Phone</label>
                        <div class="input-wrapper">
                            <i class="fas fa-envelope input-icon"></i>
                            <input type="text" id="email" placeholder="Enter your email or phone" required>
                        </div>
                        <div class="error-message" id="emailError"></div>
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <div class="input-wrapper">
                            <i class="fas fa-lock input-icon"></i>
                            <input type="password" id="password" placeholder="Enter your password" required>
                            <button type="button" class="password-toggle" id="passwordToggle">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                        <div class="error-message" id="passwordError"></div>
                    </div>

                    <div class="form-options">
                        <label class="checkbox-container">
                            <input type="checkbox" id="rememberMe">
                            <span class="checkmark"></span>
                            Keep me signed in
                        </label>
                        <a href="#" class="forgot-password">Forgot password?</a>
                    </div>

                    <button type="submit" class="auth-button primary">
                        <span class="button-text">Sign In</span>
                        <div class="button-loader" style="display: none;">
                            <div class="spinner"></div>
                        </div>
                    </button>

                    <div class="divider">
                        <span>or</span>
                    </div>

                    <div class="social-login">
                        <button type="button" class="social-button google">
                            <i class="fab fa-google"></i>
                            Continue with Google
                        </button>
                        <button type="button" class="social-button facebook">
                            <i class="fab fa-facebook-f"></i>
                            Continue with Facebook
                        </button>
                        <button type="button" class="social-button apple">
                            <i class="fab fa-apple"></i>
                            Continue with Apple
                        </button>
                    </div>
                </form>

                <div class="form-footer">
                    <p>Don't have an account? <a href="auth.html" class="link">Create one</a></p>
                </div>

                <div id="message" class="message"></div>
            </div>
        </div>
    </div>

    <script src="../js/auth.js"></script>
    <script>
        // Password toggle functionality
        document.getElementById('passwordToggle').addEventListener('click', function() {
            const passwordInput = document.getElementById('password');
            const icon = this.querySelector('i');

            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        });

        // Form validation
        function validateEmail(email) {
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            const phoneRegex = /^[\+]?[1-9][\d]{0,15}$/;
            return emailRegex.test(email) || phoneRegex.test(email);
        }

        function showError(elementId, message) {
            const errorElement = document.getElementById(elementId);
            errorElement.textContent = message;
            errorElement.style.display = 'block';
            setTimeout(() => {
                errorElement.style.display = 'none';
            }, 5000);
        }

        function hideErrors() {
            document.querySelectorAll('.error-message').forEach(el => {
                el.style.display = 'none';
            });
        }

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            hideErrors();

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            let isValid = true;

            if (!validateEmail(email)) {
                showError('emailError', 'Please enter a valid email or phone number');
                isValid = false;
            }

            if (password.length < 1) {
                showError('passwordError', 'Password is required');
                isValid = false;
            }

            if (!isValid) return;

            // Show loading
            const button = this.querySelector('.auth-button');
            const buttonText = button.querySelector('.button-text');
            const loader = button.querySelector('.button-loader');
            buttonText.style.display = 'none';
            loader.style.display = 'block';
            button.disabled = true;

            const result = authManager.login(email, password);
            const messageDiv = document.getElementById('message');

            // Hide loading
            buttonText.style.display = 'inline';
            loader.style.display = 'none';
            button.disabled = false;

            if (result.success) {
                messageDiv.className = 'message success';
                messageDiv.textContent = result.message;
                messageDiv.style.display = 'block';
                setTimeout(() => {
                    window.location.href = '../index.html';
                }, 1000);
            } else {
                messageDiv.className = 'message error';
                messageDiv.textContent = result.message;
                messageDiv.style.display = 'block';
            }
        });

        // Check if already logged in
        if (authManager.getCurrentUser()) {
            window.location.href = '../index.html';
        }

        // Input focus animations
        document.querySelectorAll('.input-wrapper input').forEach(input => {
            input.addEventListener('focus', function() {
                this.parentElement.classList.add('focused');
            });
            input.addEventListener('blur', function() {
                this.parentElement.classList.remove('focused');
            });
        });
    </script>
</body>
</html>
